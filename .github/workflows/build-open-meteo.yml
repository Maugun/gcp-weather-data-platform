name: Build and Deploy Open-Meteo

on:
  push:
    branches:
      - master
    paths:
      - "ingestion/open-meteo/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: open-meteo-dev-deploy
  cancel-in-progress: false

env:
  ARTIFACT_REPOSITORY: weather-platform
  IMAGE_NAME: open-meteo

jobs:
  deploy:
    name: Build and deploy Open-Meteo
    runs-on: ubuntu-24.04

    if: github.ref == 'refs/heads/master'

    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        working-directory: ingestion/open-meteo
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            .

      - name: Push Docker image
        working-directory: ingestion/open-meteo
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "${IMAGE_URI}"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Terraform init
        working-directory: infrastructure/terraform/environments/dev
        run: terraform init

      - name: Terraform plan
        working-directory: infrastructure/terraform/environments/dev
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_open_meteo_image_tag: ${{ github.sha }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        working-directory: infrastructure/terraform/environments/dev
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_github_repository: ${{ github.repository }}
          TF_VAR_open_meteo_image_tag: ${{ github.sha }}
        run: terraform apply -input=false tfplan

      - name: Smoke test Cloud Run Job
        run: |
          gcloud run jobs execute open-meteo-ingestion \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --region="${{ vars.GCP_REGION }}" \
            --wait
