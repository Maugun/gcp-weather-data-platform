name: Build Open-Meteo

on:
  push:
    branches:
      - master
    paths:
      - "ingestion/open-meteo/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ARTIFACT_REPOSITORY: weather-platform
  IMAGE_NAME: open-meteo

jobs:
  build:
    name: Build and push Docker image
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            ${{ vars.GCP_REGION }}-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        working-directory: ingestion/open-meteo
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            -t "${IMAGE_URI}" \
            .

      - name: Push Docker image
        working-directory: ingestion/open-meteo
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${ARTIFACT_REPOSITORY}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker push "${IMAGE_URI}"
