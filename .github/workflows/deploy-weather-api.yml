name: Deploy Weather API

on:
  push:
    branches:
      - master
    paths:
      - "api/weather-api/**"
      - ".github/workflows/deploy-weather-api.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: weather-api-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: dev

    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      ARTIFACT_REPOSITORY: weather-platform
      SERVICE_NAME: weather-api
      TF_DIR: infrastructure/terraform/environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build Weather API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker build \
            -t "$IMAGE" \
            api/weather-api

      - name: Push Weather API image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${ARTIFACT_REPOSITORY}/${SERVICE_NAME}:${GITHUB_SHA}"
          docker push "$IMAGE"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Load deployed Open-Meteo image tag
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "TF_VAR_open_meteo_image_tag=$(terraform output -raw open_meteo_image_tag)" >> "$GITHUB_ENV"

      - name: Set Weather API release tag
        run: |
          echo "TF_VAR_weather_api_image_tag=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Terraform plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          terraform plan \
            -input=false \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -input=false -auto-approve tfplan
